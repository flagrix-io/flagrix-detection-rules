name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate
      - name: Build and compare with the committed signatures.json
        run: |
          cp signatures.json "$RUNNER_TEMP/committed-signatures.json"
          npm run build
          npx tsx scripts/check-signatures.ts "$RUNNER_TEMP/committed-signatures.json" signatures.json
